name: Update Count

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-count:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read registrations count from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"

          curl -sS \
            -D headers.txt \
            -o /dev/null \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Prefer: count=exact" \
            "$SUPABASE_URL/rest/v1/registrations?select=created_at&head=true"

          COUNT=$(awk -F'[/ ]+' 'tolower($1) ~ /^content-range:/ { print $3 }' headers.txt | tail -n 1)

          if [ -z "$COUNT" ]; then
            echo "Impossibile leggere Content-Range da Supabase"
            cat headers.txt
            exit 1
          fi

          UPDATED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > count.json <<EOF
          {
            "count": $COUNT,
            "updated_at": "$UPDATED_AT"
          }
          EOF

      - name: Commit updated count
        run: |
          if git diff --quiet -- count.json; then
            echo "Nessuna modifica a count.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add count.json
          git commit -m "Update registrations count"
          git push
